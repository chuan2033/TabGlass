plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

kotlin {
    jvmToolchain(21)
}

// 签名与背屏模块同一套做法：密钥库 app/release-key.jks（*.jks 已被忽略），
// 密码只写 local.properties 或同名环境变量。缺密钥时退回 debug 签名，
// clone 下来的人照样能 assembleRelease，只是产物不能用于分发。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.isFile()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def signingValue = { String key -> localProps[key] ?: System.getenv(key) }
def releaseKeystoreFile = file(signingValue('RELEASE_STORE_FILE') ?: 'release-key.jks')
def hasReleaseSigning = releaseKeystoreFile.isFile()
        && signingValue('RELEASE_STORE_PASSWORD')
        && signingValue('RELEASE_KEY_PASSWORD')
if (signingValue('RELEASE_STORE_FILE') && !hasReleaseSigning) {
    throw new GradleException('Configured signing key is unavailable or missing RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD')
}

android {
    // 一个 APK 两个身份：模块本体（io.github.XQ.TabGlass）+ 设置界面（.settings 子包）。
    // 包名必须和 META-INF/xposed/java_init.list 里的入口类前缀一致，否则 LSPosed 不加载。
    namespace 'io.github.XQ.TabGlass'
    compileSdk 37
    buildToolsVersion = "37.0.0"

    defaultConfig {
        applicationId "io.github.XQ.TabGlass"
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword signingValue('RELEASE_STORE_PASSWORD')
                keyAlias signingValue('RELEASE_KEY_ALIAS') ?: 'tabglass'
                keyPassword signingValue('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            // 和 release 用同一把钥匙：debug / release 可以互相覆盖安装，换装不用先卸载。
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        // META-INF/xposed 是 LSPosed 识别模块的依据，不能被压缩排除掉。
        resources {
            excludes += []
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4'

    // libxposed API 102（Apache-2.0）：只在编译期需要，运行时由框架提供。
    // 官方没有发布到 Maven，jar 随仓库放在 libs/ 下，clone 后即可离线构建。
    compileOnly files('../libs/xposed-api-102.jar')
}
